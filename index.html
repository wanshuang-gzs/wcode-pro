<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WCode Pro — 订阅</title>
<meta name="description" content="WCode Pro 订阅：解锁全部高级模型，每月 5000 积分。">
<script src="https://cdn.paddle.com/paddle/v2/paddle.js" onerror="document.addEventListener('DOMContentLoaded', function(){ document.getElementById('price-month').textContent='×'; document.getElementById('price-year').textContent='×'; document.getElementById('subscribe-btn').textContent='重试'; document.getElementById('subscribe-btn').classList.add('secondary'); document.getElementById('subscribe-btn').disabled=false; document.getElementById('status').textContent='支付组件加载失败：无法访问 cdn.paddle.com（请检查网络或代理）'; document.getElementById('status').className='error'; });"></script>
<style>
  :root {
    --pro: #7C4DFF;
    --pro-deep: #5B3DF5;
    --bg: #0A0A0A;
    --panel: #121212;
    --card: #1C1C1C;
    --text: #F5F5F5;
    --muted: #9e9e9e;
    --error: #FF8A5C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; }
  .hero {
    width: 100%; max-width: 420px;
    background: linear-gradient(135deg, var(--pro), var(--pro-deep));
    border-radius: 20px; padding: 28px 24px; margin-bottom: 20px;
    box-shadow: 0 12px 32px rgba(124,77,255,.25);
  }
  .hero h1 { font-size: 26px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
  .hero h1 .mark { background: rgba(255,255,255,.2); border-radius: 50%; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .hero p { color: rgba(255,255,255,.92); margin-top: 8px; font-size: 14px; }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  .feature { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
  .feature .dot { width: 18px; height: 18px; flex: none; border-radius: 50%; background: rgba(124,77,255,.15);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--pro); }
  .note { max-width: 420px; font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  .billing { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 16px; }
  .billing .opt {
    flex: 1; border-radius: 16px; padding: 14px; cursor: pointer; user-select: none;
    background: var(--card); border: 1px solid rgba(255,255,255,.15); transition: all .15s;
  }
  .billing .opt h3 { font-size: 14px; color: var(--muted); font-weight: 600; }
  .billing .opt .price { font-size: 24px; font-weight: 800; color: var(--text); margin-top: 2px; white-space: nowrap; }
  .billing .opt small { font-size: 11px; color: var(--muted); }
  .billing .opt.selected { background: rgba(124,77,255,.10); border: 2px solid var(--pro); }
  .billing .opt.selected h3 { color: var(--pro); }
  .btn {
    width: 100%; max-width: 420px; height: 52px; border: none; border-radius: 14px;
    background: var(--pro); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secondary { background: transparent; border: 1px solid rgba(255,255,255,.2); font-weight: 600; }
  #status { width: 100%; max-width: 420px; text-align: center; font-size: 13px;
    color: var(--muted); margin-top: 14px; min-height: 18px; }
  #status.error { color: var(--error); }
</style>
</head>
<body>

  <div class="hero">
    <h1><span class="mark">✦</span>WCode Pro</h1>
    <p>解锁全部高级模型 · 每月 5000 积分</p>
  </div>

  <div class="card">
    <div class="feature"><span class="dot">✓</span>Pro 专属模型（GPT-4o / Claude / Grok / Mistral）</div>
    <div class="feature"><span class="dot">✓</span>每月 5000 积分，周期内自动重置</div>
    <div class="feature"><span class="dot">✓</span>App 与微信通道共享权益</div>
  </div>

  <p class="note">支付由 Paddle 安全处理；价格为 Paddle 按你的所在地实时换算的本地化价格（含税总价）。</p>

  <div class="billing">
    <div class="opt" id="opt-month">
      <h3>月付</h3>
      <div class="price" id="price-month">…</div>
      <small>随时取消</small>
    </div>
    <div class="opt selected" id="opt-year">
      <h3>年付</h3>
      <div class="price" id="price-year">…</div>
      <small>推荐 · 连续订阅</small>
    </div>
  </div>

  <button class="btn" id="subscribe-btn" disabled>正在加载价格…</button>
  <div id="status"></div>

<script>
  // 客户端令牌可公开嵌入（Paddle 官方允许）；如需轮换，替换后重新部署即可
  var CLIENT_TOKEN = 'live_f6faf2e14b6a187b46d1e431b14';
  var PRICE_MONTH = 'pri_01kzy2ff2ymzps399pvfypme67'; // Pro 月付
  var PRICE_YEAR  = 'pri_01kzy2ff4z39a3ryxz6ykr1w7w'; // Pro 年付

  var monthly = true;
  var monthTotal = null;
  var yearTotal = null;
  var initPromise = null;

  function setStatus(msg, isError) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  // 错误直接显示在价格位置，方便发现网络/初始化问题
  function showPriceError(msg) {
    document.getElementById('price-month').textContent = '×';
    document.getElementById('price-year').textContent = '×';
    document.getElementById('subscribe-btn').textContent = '重试';
    document.getElementById('subscribe-btn').classList.add('secondary');
    document.getElementById('subscribe-btn').disabled = false;
    setStatus(msg, true);
  }

  function withTimeout(p, ms, label) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () {
        reject(new Error(label + '（' + ms / 1000 + ' 秒）'));
      }, ms);
      p.then(function (v) { clearTimeout(t); resolve(v); },
             function (e) { clearTimeout(t); reject(e); });
    });
  }

  // 官方 v2 初始化，只调一次；后续 API 都在该 Promise 之后执行
  function ensureInitialized() {
    if (typeof Paddle === 'undefined') return Promise.reject(new Error('Paddle.js 未加载'));
    if (!initPromise) {
      initPromise = Paddle.Initialize({
        token: CLIENT_TOKEN,
        checkout: {
          settings: {
            displayMode: 'overlay',
            variant: 'one-page',
            frameInitialHeight: '520',
            frameStyle: 'width: 100%; min-width: 312px; background-color: #fff; border: none;'
          }
        }
      });
    }
    return initPromise;
  }

  function openCheckout(priceId) {
    ensureInitialized().then(function () {
      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }],
        customData: { source: 'wcode_pricing_page' }
      });
    }).catch(function (e) {
      setStatus('拉起支付失败: ' + (e && e.message ? e.message : e), true);
    });
  }

  // PricePreview：等 Initialize 完成后取价，只展示 Paddle 返回的 formattedTotals
  function loadPrices() {
    var btn = document.getElementById('subscribe-btn');
    btn.disabled = true;
    btn.textContent = '正在加载价格…';
    withTimeout(ensureInitialized(), 15000, 'Paddle 初始化超时：无法连接 Paddle 服务器').then(function () {
      return withTimeout(
        Paddle.PricePreview.preview({
          items: [
            { priceId: PRICE_MONTH, quantity: 1 },
            { priceId: PRICE_YEAR, quantity: 1 }
          ]
        }),
        15000, '价格获取超时：无法连接 Paddle 服务器'
      );
    }).then(function (res) {
      var items = res && res.items || [];
      if (items.length >= 2) {
        monthTotal = items[0].formattedTotals && items[0].formattedTotals.total || null;
        yearTotal  = items[1].formattedTotals && items[1].formattedTotals.total || null;
      }
      document.getElementById('price-month').textContent = monthTotal || '—';
      document.getElementById('price-year').textContent = yearTotal || '—';
      btn.disabled = false;
      btn.textContent = '订阅 ' + (monthly ? '月付' : '年付') + ' ' + (monthly ? monthTotal : yearTotal);
      // 支持 ?checkout=month / ?checkout=year 自动打开结账（验证用）
      var q = new URLSearchParams(location.search).get('checkout');
      if (q === 'month') openCheckout(PRICE_MONTH);
      else if (q === 'year') openCheckout(PRICE_YEAR);
    }).catch(function (e) {
      showPriceError('价格加载失败: ' + (e && e.message ? e.message : e));
    });
  }

  document.getElementById('opt-month').addEventListener('click', function () {
    monthly = true;
    this.classList.add('selected');
    document.getElementById('opt-year').classList.remove('selected');
    document.getElementById('subscribe-btn').textContent = '订阅 月付 ' + (monthTotal || '');
  });
  document.getElementById('opt-year').addEventListener('click', function () {
    monthly = false;
    this.classList.add('selected');
    document.getElementById('opt-month').classList.remove('selected');
    document.getElementById('subscribe-btn').textContent = '订阅 年付 ' + (yearTotal || '');
  });
  document.getElementById('subscribe-btn').addEventListener('click', function () {
    if (this.disabled) return;
    if (monthTotal === null || yearTotal === null) { loadPrices(); return; }
    openCheckout(monthly ? PRICE_MONTH : PRICE_YEAR);
  });

  function waitPaddle() {
    if (typeof Paddle !== 'undefined') {
      loadPrices();
      return;
    }
    setTimeout(waitPaddle, 200);
  }
  setTimeout(waitPaddle, 100);

  if (typeof Paddle !== 'undefined') {
    Paddle.EventBus.on('checkout.completed', function () {
      setStatus('支付成功！返回 WCode App 即可使用 Pro 权益');
    });
  }
</script>
</body>
</html>
